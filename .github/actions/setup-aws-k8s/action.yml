name: Setup AWS and Kubernetes tooling
description: Installs AWS CLI and kubectl

inputs:
  kubectl-version:
    description: Kubernetes minor version for apt repo
    required: false
    default: "1.35"

runs:
  using: composite
  steps:
  - name: Install AWS CLI
    shell: bash
    run: |
      curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
      unzip -q /tmp/awscliv2.zip -d /tmp
      sudo /tmp/aws/install

  - name: Install kubectl
    shell: bash
    run: |
      curl -fsSL "https://pkgs.k8s.io/core:/stable:/v${{ inputs.kubectl-version }}/deb/Release.key" \
        | sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      sudo chmod 644 /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v${{ inputs.kubectl-version }}/deb/ /" \
        | sudo tee /etc/apt/sources.list.d/kubernetes.list
      sudo chmod 644 /etc/apt/sources.list.d/kubernetes.list
      sudo apt-get update
      sudo apt-get install -y kubectl

  - name: Verify installations
    shell: bash
    run: |
      docker --version
      aws --version
      kubectl version --client
